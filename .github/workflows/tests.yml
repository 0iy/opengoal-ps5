name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install what the suite needs
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk python3-pil python3-numpy g++
      - name: Run the offline suite
        run: xvfb-run -a python3 tests/run_all.py
